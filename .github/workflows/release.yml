name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: read

jobs:
  release:
    name: Release
    if: ${{ github.repository == 'Netflix/jfmt' }}
    environment: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Zulu JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Set up ja
        uses: ./.github/actions/setup-ja

      - name: Test
        run: ja test --all

      - name: Publish to Maven Central
        run: ja maven deploy-central --module-version "${GITHUB_REF_NAME#v}"
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.ORG_SONATYPE_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.ORG_SONATYPE_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.ORG_SIGNING_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.ORG_SIGNING_PASSWORD }}
